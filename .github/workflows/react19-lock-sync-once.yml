name: React 19 lockfile sync

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'release/50-restaurant-hardening-2026-09-14'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild lockfile from clean dependency graph
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund
      - name: Verify React type tree
        run: |
          npm ls @types/react @types/react-dom --all
      - name: Commit generated lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json package.json apps/main/package.json
          git commit -m 'fix(deps): rebuild lockfile for React 19 dependency tree'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
