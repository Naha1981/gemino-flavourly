name: Next 15 async API migration

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'release/50-restaurant-hardening-2026-09-14'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run official Next.js async request API codemod
        run: CI=1 npx @next/codemod@latest next-async-request-api .
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/main package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'No codemod changes required.'
          else
            git commit -m 'fix(next15): migrate async request APIs'
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi
